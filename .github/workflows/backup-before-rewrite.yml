
name: Backup Before History Rewrite

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and verify Git bundle
        run: |
          git bundle create student-burnout-original.bundle --all
          git bundle verify student-burnout-original.bundle

      - name: Upload original history backup
        uses: actions/upload-artifact@v4
        with:
          name: student-burnout-original-history
          path: student-burnout-original.bundle
          retention-days: 90
