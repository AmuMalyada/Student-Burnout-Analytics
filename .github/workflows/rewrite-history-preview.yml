
name: Rewrite History Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-filter-repo
        run: |
          pipx install git-filter-repo
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Save original history
        run: |
          git log --all --format='%H | %an <%ae> | %cn <%ce> | %aI | %cI | %s' > /tmp/original-history.txt

      - name: Prepare identity mapping
        run: |
          cat > /tmp/author-mailmap.txt <<'EOF'
          Amukta Malyada <309342361+AmuMalyada@users.noreply.github.com> V B S Raj Kalyan <vbsrajkalyan@gmail.com>
          EOF

      - name: Rewrite identities locally
        run: |
          git filter-repo --force --mailmap /tmp/author-mailmap.txt

      - name: Verify rewritten history
        run: |
          set -euo pipefail
          mkdir -p preview

          git log --all --format='%H | %an <%ae> | %cn <%ce> | %aI | %cI | %s' > preview/rewritten-history.txt

          git log --all --format='%an <%ae>' | sort | uniq -c > preview/author-summary.txt
          git log --all --format='%cn <%ce>' | sort | uniq -c > preview/committer-summary.txt
          git for-each-ref --format='%(refname) %(objectname)' > preview/references.txt

          if grep -qi 'vbsrajkalyan@gmail.com' preview/rewritten-history.txt; then
            echo "Old author identity remains."
            exit 1
          fi

          COUNT=$(git log --all --format='%ae' | grep -Fxc '309342361+AmuMalyada@users.noreply.github.com' || true)

          if [ "$COUNT" -ne 2 ]; then
            echo "Expected exactly 2 rewritten original authors; found $COUNT."
            exit 1
          fi

          if ! grep -Fq 'GitHub <noreply@github.com>' preview/rewritten-history.txt; then
            echo "GitHub system committer missing."
            exit 1
          fi

          cp /tmp/original-history.txt preview/original-history.txt
          cp /tmp/author-mailmap.txt preview/author-mailmap.txt

          echo "Original authors rewritten: 2" > preview/verification.txt
          echo "Old identity remaining: No" >> preview/verification.txt
          echo "GitHub system committer preserved: Yes" >> preview/verification.txt
          echo "Remote push performed: No" >> preview/verification.txt

      - name: Create and verify preview bundle
        run: |
          git bundle create preview/student-burnout-rewritten-preview.bundle --all
          git bundle verify preview/student-burnout-rewritten-preview.bundle

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: student-burnout-rewrite-preview
          path: preview/
          retention-days: 30
